<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시계 보기 연습</title>

<!-- 오픈소스: Pretendard 글꼴 (github.com/orioncactus/pretendard, SIL OFL) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 오픈소스: canvas-confetti (github.com/catdad/canvas-confetti, ISC) — 인터넷이 없어도 되도록 lib 폴더에 저장 -->
<!-- 오픈소스: react-clock (github.com/wojtekmaj/react-clock, MIT) — React와 함께 한 파일로 묶어 lib 폴더에 저장 -->
<link rel="stylesheet" href="lib/react-clock.css">
<script src="lib/react-clock.bundle.js"></script>
<script src="lib/confetti.browser.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';document.head.appendChild(s)"></script>

<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1e2740; --muted:#5f6b85; --line:#e3dfd4;
  --primary:#3b4cca; --primary-soft:#e9ecff;
  --hour:#e8590c; --hour-soft:#fff0e6;
  --minute:#1971c2; --minute-soft:#e7f3ff;
  --ok:#2b8a3e; --ok-soft:#e5f6e9; --no:#c92a2a; --no-soft:#fdeceb;
  --shadow:0 .6rem 1.8rem rgba(30,39,64,.08), 0 .1rem .3rem rgba(30,39,64,.06);
}
*{box-sizing:border-box}
html{font-size:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible{outline:.2rem solid var(--primary); outline-offset:.15rem}

.wrap{max-width:68rem; margin:0 auto; padding:1.25rem 1rem 3rem}

/* ── 머리말 ── */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:.75rem 1rem; margin-bottom:1.25rem}
.brand{display:flex; align-items:center; gap:.7rem; margin-right:auto}
.brand .logo{width:2.8rem; height:2.8rem; flex:none}
.brand h1{font-size:1.6rem; font-weight:800; margin:0; letter-spacing:-.02em}
.tools{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.tool{
  display:inline-flex; align-items:center; gap:.4rem; min-height:2.9rem; padding:.45rem .9rem;
  background:var(--card); border:.1rem solid var(--line); border-radius:999px; font-weight:700; font-size:1rem;
}
.tool:hover{border-color:var(--primary)}
.tool[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.zoom{display:inline-flex; align-items:center; background:var(--card); border:.1rem solid var(--line); border-radius:999px; overflow:hidden}
.zoom button{border:0; background:none; min-height:2.9rem; padding:0 .9rem; font-weight:800}
.zoom button:hover:not(:disabled){background:var(--primary-soft)}
.zoom button:disabled{opacity:.35; cursor:default}
.zoom .small{font-size:.9rem} .zoom .big{font-size:1.35rem}
.zoom output{min-width:3.4rem; text-align:center; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}

/* ── 탭 / 단계 ── */
.tabs{display:inline-flex; background:#e7e3d8; border-radius:999px; padding:.25rem; margin-bottom:1rem}
.tabs button{border:0; background:none; padding:.55rem 1.2rem; border-radius:999px; font-weight:700; font-size:1.05rem; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card); color:var(--ink); box-shadow:0 .1rem .3rem rgba(0,0,0,.1)}

.levels{display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.25rem}
.level{
  flex:1 1 9rem; text-align:left; background:var(--card); border:.15rem solid var(--line); border-radius:1.1rem;
  padding:.75rem 1rem; display:flex; flex-direction:column; gap:.1rem;
}
.level small{font-size:.85rem; font-weight:700; color:var(--muted)}
.level b{font-size:1.3rem; font-weight:800}
.level span{font-size:.95rem; color:var(--muted)}
.level:hover{border-color:var(--primary)}
.level[aria-pressed="true"]{background:var(--primary); border-color:var(--primary); color:#fff}
.level[aria-pressed="true"] small,.level[aria-pressed="true"] span{color:#dfe3ff}

/* ── 문제 화면 ── */
.card{background:var(--card); border-radius:1.6rem; box-shadow:var(--shadow); padding:1.5rem}
.stage{display:flex; flex-wrap:wrap; gap:1.5rem 2rem; align-items:center}
.clock-side{flex:1 1 19rem; display:flex; flex-direction:column; align-items:center; gap:.8rem; min-width:0}
.clock{width:min(23rem,100%)}

/* 시계: react-clock 위에 입힌 디자인. 크기는 모두 시계 상자 너비(cqw) 기준이라 확대·인쇄에도 비율이 같다 */
.clockbox{position:relative; width:100%; aspect-ratio:1; container-type:inline-size}
.clockbox .rc{position:absolute; inset:9%}
.react-clock__face{
  border:1.7cqw solid #1e2740;
  background:radial-gradient(circle at 50% 32%, #ffffff 0 52%, #f1f4fb 100%);
  box-shadow:0 0 0 .9cqw #fff, 0 0 0 1.2cqw #d5dae6, 0 3.5cqw 7cqw rgba(30,39,64,.20);
}
.react-clock__mark__body{border-radius:99px}
.react-clock__hour-mark__body{width:1.15cqw!important; background:#1e2740}
.react-clock__minute-mark__body{width:.5cqw!important; background:#a3abbe}
.react-clock__mark__number{
  left:-10cqw; width:20cqw; margin-top:2.6cqw; font-size:8.6cqw; font-weight:800; line-height:1; color:#1e2740;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em;
}
.react-clock__hand__body{border-radius:99px; box-shadow:0 .7cqw 1.4cqw rgba(30,39,64,.28)}
.react-clock__hour-hand__body{width:4.5cqw!important; background:linear-gradient(90deg,#f76707,#d9480f)}
.react-clock__minute-hand__body{width:2.7cqw!important; background:linear-gradient(90deg,#228be6,#1864ab)}
.react-clock::after{
  content:""; position:absolute; left:50%; top:50%; width:7cqw; height:7cqw; transform:translate(-50%,-50%);
  border-radius:50%; background:#1e2740; border:1.6cqw solid #fff; box-shadow:0 0 0 .6cqw #1e2740, 0 .6cqw 1.4cqw rgba(30,39,64,.3);
}
.mlabel{position:absolute; transform:translate(-50%,-50%); font-size:5.2cqw; font-weight:800; line-height:1; color:#1971c2; font-variant-numeric:tabular-nums}
.page .react-clock__face{box-shadow:none}
.page .react-clock__hand__body, .page .react-clock::after{box-shadow:none}
.page .react-clock::after{box-shadow:0 0 0 .6cqw #1e2740}
.legend{display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center}
.chip{display:inline-flex; align-items:center; gap:.45rem; padding:.3rem .8rem; border-radius:999px; font-weight:700; font-size:1rem}
.chip i{display:inline-block; height:.4rem; border-radius:.2rem}
.chip.h{background:var(--hour-soft); color:#b34100} .chip.h i{width:1.1rem; background:var(--hour)}
.chip.m{background:var(--minute-soft); color:#0f5a9c} .chip.m i{width:1.9rem; background:var(--minute)}

.answer-side{flex:1 1 21rem; min-width:0}
.status{display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-bottom:.4rem}
.stars{font-weight:800; font-size:1.1rem; background:#fff7d6; color:#8a6100; padding:.25rem .8rem; border-radius:999px}
.hintbtn{border:.1rem solid var(--line); background:var(--card); border-radius:999px; padding:.35rem .9rem; font-weight:700}
.hintbtn[aria-pressed="true"]{background:#fff7d6; border-color:#f2c94c}
.question{font-size:1.9rem; font-weight:800; margin:.2rem 0 1rem; letter-spacing:-.02em}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:.8rem}
.choice{
  min-height:4.6rem; padding:.8rem .5rem; background:var(--card); border:.15rem solid var(--line); border-radius:1.1rem;
  font-size:1.6rem; font-weight:800; transition:transform .08s, border-color .15s, background .15s;
  font-variant-numeric:tabular-nums;
}
.choice:hover:not(:disabled){border-color:var(--primary); background:var(--primary-soft)}
.choice:active:not(:disabled){transform:scale(.97)}
.choice:disabled{cursor:default}
.choice.wrong{background:var(--no-soft); border-color:#f1b5b1; color:#b08a88; text-decoration:line-through; animation:shake .35s}
.choice.right{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.choice.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}

.hintbox{margin-top:1rem; background:#fffaf0; border:.1rem solid #f3e2b3; border-radius:1rem; padding:.8rem 1rem; font-size:1.1rem}
.hintbox p{margin:.15rem 0}
.hintbox .hh{color:#b34100; font-weight:800} .hintbox .mm{color:#0f5a9c; font-weight:800}

.feedback{margin-top:1rem; border-radius:1rem; padding:.9rem 1.1rem; font-size:1.2rem; min-height:1rem}
.feedback:empty{display:none}
.feedback.ok{background:var(--ok-soft); color:#1c6b2c}
.feedback.no{background:var(--no-soft); color:#a12323}
.feedback strong{display:block; font-size:1.6rem; font-weight:800}
.chimes{display:flex; flex-wrap:wrap; align-items:center; gap:.2rem; margin-top:.5rem}
.bell{font-size:1.5rem; opacity:.22; filter:grayscale(1); transition:opacity .15s, filter .15s}
.bell.on{opacity:1; filter:none; animation:ring .5s}
.chime-count{margin-left:.5rem; font-weight:800; font-size:1.3rem}
@keyframes ring{20%{transform:rotate(-22deg) scale(1.3)}50%{transform:rotate(18deg) scale(1.3)}80%{transform:rotate(-8deg)}}
.next{
  margin-top:1rem; width:100%; min-height:4rem; border:0; border-radius:1.1rem; background:var(--primary); color:#fff;
  font-size:1.5rem; font-weight:800;
}
.next:hover{filter:brightness(1.08)}
/* 전자시계: 오픈소스 7세그먼트 글꼴 DSEG (github.com/keshikan/DSEG, SIL OFL) */
@font-face{font-family:"DSEG7"; src:url("lib/DSEG7Classic-Bold.woff2") format("woff2"); font-weight:700; font-display:block}
.dclock{width:100%; container-type:inline-size}
.dbody{
  padding:5cqw 5cqw 4cqw; border-radius:8cqw; background:linear-gradient(160deg,#2b3657,#1a2238);
  box-shadow:0 3.5cqw 7cqw rgba(30,39,64,.22), inset 0 .5cqw 0 rgba(255,255,255,.12);
}
.dscreen{
  display:grid; justify-content:center; padding:6cqw 3cqw 11cqw; border-radius:4.5cqw;
  background:linear-gradient(180deg,#dfe8dc,#eef3ea); box-shadow:inset 0 .8cqw 1.6cqw rgba(30,39,64,.22);
  font-family:"DSEG7",monospace; font-weight:700; font-size:21cqw; line-height:1; color:#1e2740; white-space:nowrap;
}
.dscreen > *{grid-area:1/1}
.dghost{opacity:.07}
.dh,.dm{position:relative; display:inline-block}
.dh::after,.dm::after{
  position:absolute; left:0; right:0; top:calc(100% + 2cqw); text-align:center; display:none;
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif; font-size:6cqw; font-weight:800;
}
.dh::after{content:"시"} .dm::after{content:"분"}
.dclock.hint .dh{color:#d9480f} .dclock.hint .dm{color:#1864ab}
.dclock.hint .dh::after,.dclock.hint .dm::after{display:block}
.dbrand{margin-top:2.5cqw; text-align:center; font-size:3.6cqw; font-weight:700; letter-spacing:.35em; color:#8f9bbd}
.page .dbody,.page .dscreen{box-shadow:none}
.p-item .dclock{width:62mm; flex:none}
.modebar{display:flex; flex-wrap:wrap; gap:.4rem 1rem}
.modes{display:inline-flex; flex-wrap:wrap; background:#eeebe2; border-radius:999px; padding:.25rem; margin-bottom:1.2rem}
.modes button{border:0; background:none; padding:.5rem 1.1rem; border-radius:999px; font-weight:700; font-size:1.05rem; color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink); color:#fff}
.stop{
  width:100%; min-height:6.5rem; border:0; border-radius:1.3rem; background:var(--hour); color:#fff;
  font-size:2.2rem; font-weight:800; box-shadow:0 .35rem 0 #b34100; transition:transform .08s, box-shadow .08s;
}
.stop:hover:not(:disabled){filter:brightness(1.06)}
.stop:active:not(:disabled){transform:translateY(.25rem); box-shadow:0 .1rem 0 #b34100}
.stop:disabled{opacity:.6; cursor:default}
[hidden]{display:none!important}

/* ── 종이 학습지 ── */
.sheet-opts{display:flex; flex-wrap:wrap; gap:.8rem 1.5rem; align-items:center; margin-bottom:1.25rem}
.sheet-opts fieldset{border:0; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
.sheet-opts legend{float:left; font-weight:800; margin-right:.6rem; padding:0}
.pill{display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .9rem; border:.1rem solid var(--line); border-radius:999px; font-weight:700; background:var(--card); cursor:pointer}
.pill input{width:1.15rem; height:1.15rem; accent-color:var(--primary); margin:0}
.pill:has(input:checked){border-color:var(--primary); background:var(--primary-soft)}
.sheet-actions{display:flex; flex-wrap:wrap; gap:.6rem; margin-left:auto}
.btn{min-height:3rem; padding:.5rem 1.2rem; border-radius:999px; border:.1rem solid var(--line); background:var(--card); font-weight:800; font-size:1.05rem}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
.pages{overflow-x:auto; padding:.5rem 0 1rem}

.page{
  width:210mm; height:296mm; margin:0 auto 8mm; padding:13mm 14mm 10mm; background:#fff; color:#1e2740;
  box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; font-size:12pt; line-height:1.4;
}
.p-head{display:flex; align-items:center; justify-content:space-between; gap:6mm}
.p-title{font-size:22pt; font-weight:800; letter-spacing:-.02em}
.p-badge{font-size:12pt; font-weight:800; padding:1.5mm 5mm; border-radius:99mm; background:#1e2740; color:#fff; white-space:nowrap}
.p-badge.ans{background:#c92a2a}
.p-info{display:flex; gap:8mm; margin-top:5mm; font-size:13pt; font-weight:700}
.p-info span{display:flex; align-items:flex-end; gap:2mm}
.p-info u{display:inline-block; border-bottom:.4mm solid #1e2740; height:7mm; text-decoration:none}
.p-guide{margin-top:5mm; padding:2.5mm 5mm; background:#f3f4f8; border-radius:3mm; font-size:14pt; font-weight:700}
.p-grid{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr); gap:4mm 5mm; margin-top:5mm}
.p-item{position:relative; border:.4mm solid #cfd4e0; border-radius:5mm; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5mm; padding:2mm; min-height:0}
.p-num{position:absolute; top:2.5mm; left:2.5mm; width:9mm; height:9mm; border-radius:50%; background:#1e2740; color:#fff; font-weight:800; font-size:12pt; display:grid; place-items:center}
.p-item .clockbox{width:53mm; flex:none}
.p-ans{display:flex; align-items:center; gap:2mm; font-size:17pt; font-weight:800}
.p-blank{display:inline-grid; place-items:center; width:17mm; height:11mm; border:.5mm solid #1e2740; border-radius:2.5mm; color:#c92a2a; font-variant-numeric:tabular-nums}
.p-foot{display:flex; justify-content:space-between; align-items:center; margin-top:4mm; font-size:10.5pt; font-weight:700; color:#5f6b85}
.p-foot .k{display:inline-flex; align-items:center; gap:1.5mm; margin-right:5mm}
.p-foot i{display:inline-block; height:1.4mm; border-radius:1mm}
.p-foot .kh{color:#b34100} .p-foot .kh i{width:5mm; background:#e8590c}
.p-foot .km{color:#0f5a9c} .p-foot .km i{width:9mm; background:#1971c2}

@page{size:A4 portrait; margin:0}
@media print{
  html{font-size:100%!important}
  body{background:#fff}
  .no-print{display:none!important}
  .wrap{max-width:none; padding:0; margin:0}
  #sheetView{display:block!important}
  .pages{overflow:visible; padding:0}
  .page{margin:0; box-shadow:none; break-after:page; page-break-after:always}
  .page:last-child{break-after:auto; page-break-after:auto}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top no-print">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="#fff" stroke="#1e2740" stroke-width="3.5"/>
        <path d="M24 24V11" stroke="#1971c2" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M24 24l8 5" stroke="#e8590c" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="3" fill="#1e2740"/>
      </svg>
      <h1>시계 보기 연습</h1>
    </div>
    <div class="tools">
      <div class="zoom" role="group" aria-label="글씨와 화면 크기">
        <button type="button" id="zoomOut" aria-label="작게"><span class="small">가 −</span></button>
        <output id="zoomVal">100%</output>
        <button type="button" id="zoomIn" aria-label="크게"><span class="big">가 +</span></button>
      </div>
      <button type="button" class="tool" id="soundBtn" aria-pressed="false">🔊 소리 켜짐</button>
    </div>
  </header>

  <div class="tabs no-print" role="tablist">
    <button type="button" role="tab" id="tabPlay" aria-selected="true">🖥️ 화면으로 풀기</button>
    <button type="button" role="tab" id="tabSheet" aria-selected="false">🖨️ 종이 학습지</button>
  </div>

  <div class="levels no-print" id="levels" role="group" aria-label="단계 고르기"></div>

  <!-- 화면으로 풀기 -->
  <main id="playView" class="card no-print">
    <div class="modebar">
      <div class="modes" role="group" aria-label="시계 종류">
        <button type="button" id="kindAnalog" aria-pressed="true">🕒 바늘 시계</button>
        <button type="button" id="kindDigital" aria-pressed="false">🔢 전자시계</button>
      </div>
      <div class="modes" role="group" aria-label="문제 종류">
        <button type="button" id="modeRead" aria-pressed="true">📖 시계 읽기</button>
        <button type="button" id="modeStop" aria-pressed="false">✋ 멈춰서 읽기</button>
      </div>
    </div>
    <div class="stage">
      <div class="clock-side">
        <div class="clock" id="clock"></div>
        <div class="clock" id="digital" hidden></div>
        <div class="legend">
          <span class="chip h"><i></i><span id="legH">짧은 바늘 = 시</span></span>
          <span class="chip m"><i></i><span id="legM">긴 바늘 = 분</span></span>
        </div>
      </div>
      <div class="answer-side">
        <div class="status">
          <span class="stars" id="stars" aria-live="polite">⭐ 0개</span>
          <button type="button" class="hintbtn" id="hintBtn" aria-pressed="false">💡 도움 받기</button>
        </div>
        <h2 class="question" id="question">몇 시일까요?</h2>
        <button type="button" class="stop" id="stopBtn" hidden>✋ 멈춤!</button>
        <div class="choices" id="choices"></div>
        <div class="hintbox" id="hintBox" hidden></div>
        <div class="feedback" id="feedback" aria-live="assertive"></div>
        <button type="button" class="next" id="nextBtn" hidden>다음 문제 ▶</button>
      </div>
    </div>
  </main>

  <!-- 종이 학습지 -->
  <section id="sheetView" hidden>
    <div class="sheet-opts card no-print">
      <fieldset>
        <legend>문제 수</legend>
        <label class="pill"><input type="radio" name="cnt" value="6" checked>6문제 (1장)</label>
        <label class="pill"><input type="radio" name="cnt" value="12">12문제 (2장)</label>
      </fieldset>
      <fieldset>
        <legend>선택</legend>
        <label class="pill"><input type="checkbox" id="optHint"><span id="optHintText">분 숫자 보여 주기</span></label>
        <label class="pill"><input type="checkbox" id="optAns">정답지 함께</label>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" class="btn" id="regenBtn">🔄 새 문제 만들기</button>
        <button type="button" class="btn primary" id="printBtn">🖨️ A4로 인쇄하기</button>
      </div>
    </div>
    <div class="pages" id="pages"></div>
  </section>

</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('clock.'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('clock.'+k, JSON.stringify(v)); }catch(e){} }
};
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const LEVELS = [
  {id:1, name:'정각',      ex:'3시',       step:60},
  {id:2, name:'30분 단위', ex:'3시 30분',  step:30},
  {id:3, name:'10분 단위', ex:'3시 20분',  step:10},
  {id:4, name:'5분 단위',  ex:'3시 25분',  step:5}
];
const PRAISE = ['참 잘했어요!','정답이에요!','멋져요!','대단해요!','최고예요!','딩동댕!'];
const ZOOMS = [100,115,130,150,175,200];

const state = {
  level: Math.min(4, Math.max(1, store.get('level',1))),
  zoom: Math.min(ZOOMS.length-1, Math.max(0, store.get('zoom',0))),
  muted: !!store.get('muted', false),
  mode: store.get('mode','read') === 'stop' ? 'stop' : 'read',
  kind: store.get('kind','analog') === 'digital' ? 'digital' : 'analog',   // 바늘 시계 / 전자시계
  phase: 'answer', T: 0,        // phase: running(움직임) → stopping(멈추는 중) → answer(답 고르기)
  hint: false, stars: 0, wrong: 0, solved: false,
  cur: null, choices: [], sheet: []
};
const levelOf = () => LEVELS[state.level-1];
const key = p => p.h+':'+p.m;
const fmt = p => p.m === 0 ? `${p.h}시` : `${p.h}시 ${p.m}분`;

/* ───────── 시계 그림 (오픈소스 react-clock) ───────── */
const Kit = window.ReactClockKit;
const minutesOf = p => (p.h%12)*60 + p.m;     // 12시부터 지난 분
function labelsHTML(){                        // 시계 바깥 '분' 숫자 (0, 5, 10 …)
  let s = '';
  for(let n=1;n<=12;n++){
    const a = n*30*Math.PI/180;
    s += `<span class="mlabel" style="left:${(50+Math.sin(a)*46.5).toFixed(2)}%;top:${(50-Math.cos(a)*46.5).toFixed(2)}%">${n===12?0:n*5}</span>`;
  }
  return s;
}
function clockHTML(t, hint){
  return `<div class="clockbox" role="img" aria-label="시계 그림"><div class="rc" data-t="${t}"></div>${hint ? labelsHTML() : ''}</div>`;
}

/* ───────── 문제 만들기 ───────── */
function randomProblem(step, avoid){
  let p;
  for(let t=0;t<50;t++){
    const h = rand(12)+1;
    let m = 0;
    if(step === 30) m = Math.random() < .7 ? 30 : 0;
    else if(step < 30) m = rand(60/step)*step;
    p = {h, m};
    if(!avoid || !avoid.has(key(p))) break;
  }
  return p;
}
function makeChoices(p, step){
  const seen = new Set([key(p)]), out = [];
  const add = (h, m) => {
    h = ((h-1)%12+12)%12+1; m = ((m%60)+60)%60;
    const c = {h, m};
    if(out.length < 3 && !seen.has(key(c))){ seen.add(key(c)); out.push(c); }
  };
  // 자주 하는 실수: 긴 바늘과 짧은 바늘을 바꿔 읽기
  if(p.m > 0 && (p.h*5)%60%step === 0) add(p.m/5, p.h*5);
  const pool = [[p.h+1,p.m],[p.h-1,p.m]];
  if(step < 60) for(let m=0;m<60;m+=step) if(m!==p.m) pool.push([p.h,m]);
  shuffle(pool).forEach(c => add(c[0], c[1]));
  while(out.length < 3) add(rand(12)+1, step===60 ? 0 : rand(60/step)*step);
  return shuffle([p, ...out]);
}

/* ───────── 소리 (Web Audio로 직접 만든 소리) ───────── */
let ctx = null, bus = null, timers = [];
function audio(){
  if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function stopSound(){
  if(bus && ctx){
    const b = bus; bus = null;
    try{ b.gain.cancelScheduledValues(ctx.currentTime); b.gain.setTargetAtTime(0, ctx.currentTime, .03); }catch(e){}
    setTimeout(() => { try{ b.disconnect(); }catch(e){} }, 300);
  }
}
function newBus(){
  stopSound();
  const c = audio(); if(!c) return null;
  bus = c.createGain(); bus.gain.value = .9; bus.connect(c.destination);
  return bus;
}
function tone(freq, t, dur, type, vol){
  if(!bus) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+.05);
}
function fanfare(t){            // 빰빰빰 빰~
  [[523.25,0,.16],[659.25,.13,.16],[783.99,.26,.16],[1046.5,.4,.6]].forEach(n => {
    tone(n[0], t+n[1], n[2], 'triangle', .28); tone(n[0], t+n[1], n[2], 'square', .05);
  });
  [523.25,659.25,783.99].forEach(f => tone(f, t+.4, .6, 'triangle', .12));
}
function bell(t){               // 댕~
  [[1,.5,2.2],[2,.3,1.6],[2.4,.16,1.2],[3,.12,.9],[4.5,.07,.6],[5.33,.05,.4]].forEach(p => tone(349.23*p[0], t, p[2], 'sine', p[1]*.6));
}
function oops(t){ tone(330, t, .18, 'sine', .2); tone(262, t+.16, .28, 'sine', .2); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* ───────── 칭찬 팡파레 (색종이) ───────── */
function party(){
  if(typeof window.confetti !== 'function') return;
  const base = {disableForReducedMotion:true, zIndex:50};
  window.confetti({...base, particleCount:130, spread:90, startVelocity:42, origin:{y:.65}});
  timers.push(setTimeout(() => {
    window.confetti({...base, particleCount:60, angle:60, spread:60, origin:{x:0, y:.7}});
    window.confetti({...base, particleCount:60, angle:120, spread:60, origin:{x:1, y:.7}});
  }, 280));
}

/* ───────── 화면으로 풀기 ───────── */
function renderLevels(){
  $('#levels').innerHTML = LEVELS.map(l =>
    `<button type="button" class="level" data-level="${l.id}" aria-pressed="${l.id===state.level}"><small>${l.id}단계</small><b>${l.name}</b><span>예) ${l.ex}</span></button>`
  ).join('');
}
$('#clock').innerHTML = `<div class="clockbox" role="img" aria-label="시계 그림"><div class="rc"></div><div id="mlabels" hidden>${labelsHTML()}</div></div>`;
const mainClock = $('#clock .rc');

/* ───────── 전자시계 ───────── */
function digitalParts(T){
  const t = Math.floor((((T%720)+720)%720) + 1e-6), h = Math.floor(t/60) || 12, m = t%60;
  return {pad: h < 10 ? '!' : '', h: String(h), m: (m < 10 ? '0' : '') + m};   // '!' = 꺼진 숫자 칸
}
function digitalHTML(T, hint){
  const d = digitalParts(T);
  return `<div class="dclock${hint?' hint':''}" role="img" aria-label="전자시계 ${d.h}:${d.m}"><div class="dbody"><div class="dscreen"><span class="dghost">88:88</span><span class="dval"><span class="dpad">${d.pad}</span><span class="dh">${d.h}</span>:<span class="dm">${d.m}</span></span></div><div class="dbrand">CLOCK</div></div></div>`;
}
$('#digital').innerHTML = digitalHTML(0, false);
const dEl = {box: $('#digital .dclock'), pad: $('#digital .dpad'), h: $('#digital .dh'), m: $('#digital .dm')};

function renderClock(){
  if(state.phase === 'answer' && state.cur) state.T = minutesOf(state.cur);
  const dig = state.kind === 'digital';
  $('#clock').hidden = dig; $('#digital').hidden = !dig;
  $('#mlabels').hidden = !state.hint;
  dEl.box.classList.toggle('hint', state.hint);
  setHands(state.T);
}

/* ───────── 움직이는 시계 (멈춰서 읽기) ───────── */
const SPEED = 12;               // 1초에 12분씩 움직임 (긴 바늘 한 바퀴 5초)
let raf = 0, lastTs = 0;
function setHands(T){           // T = 12시부터 지난 분
  if(state.kind === 'digital'){
    const d = digitalParts(T);
    if(dEl.h.textContent !== d.h){ dEl.h.textContent = d.h; dEl.pad.textContent = d.pad; }
    if(dEl.m.textContent !== d.m) dEl.m.textContent = d.m;
    dEl.box.setAttribute('aria-label', `전자시계 ${d.h}:${d.m}`);
  }else Kit.render(mainClock, T);
}
function startRun(){
  cancelAnimationFrame(raf); lastTs = 0;
  const loop = ts => {
    if(lastTs) state.T += Math.min(.1, (ts-lastTs)/1000)*SPEED;
    lastTs = ts; setHands(state.T);
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function stopRun(){
  if(state.phase !== 'running') return;
  cancelAnimationFrame(raf);
  state.phase = 'stopping'; $('#stopBtn').disabled = true;
  if(!state.muted && newBus()) tone(880, ctx.currentTime+.01, .09, 'square', .09);
  // 단계에 맞는 눈금까지 천천히 가서 멈춤 (정각 / 30분 / 10분 / 5분)
  const step = levelOf().step, from = state.T, to = Math.ceil(from/step)*step;
  const dur = Math.min(1200, Math.max(250, (to-from)/SPEED*2000));
  let t0 = 0;
  const finish = () => {
    if(state.phase !== 'stopping') return;
    cancelAnimationFrame(raf);
    const t = ((Math.round(to)%720)+720)%720;
    state.T = t; state.cur = {h: Math.floor(t/60) || 12, m: t%60}; state.phase = 'answer';
    showChoices();
  };
  const anim = ts => {
    if(!t0) t0 = ts;
    const k = Math.min(1, Math.max(0, (ts-t0)/dur));
    state.T = from + (to-from)*(1-(1-k)*(1-k)); setHands(state.T);
    if(k < 1) raf = requestAnimationFrame(anim); else finish();
  };
  raf = requestAnimationFrame(anim);
  timers.push(setTimeout(finish, dur+300));   // 화면이 가려져 있어도 반드시 멈추도록
}
function renderHint(){
  const box = $('#hintBox'), btn = $('#hintBtn');
  btn.setAttribute('aria-pressed', state.hint);
  box.hidden = !state.hint;
  if(!state.hint) return;
  if(state.kind === 'digital'){
    box.innerHTML = `<p>① 점 두 개( : ) <span class="hh">앞 숫자</span>가 <b>몇 시</b>예요.</p>` + (state.level === 1
      ? `<p>② <span class="mm">뒤 숫자</span>가 00이면 <b>정각</b>이에요.</p>`
      : `<p>② 점 두 개( : ) <span class="mm">뒤 숫자</span>가 <b>몇 분</b>이에요. (05는 5분)</p>`);
    return;
  }
  box.innerHTML = state.level === 1
    ? `<p>① <span class="mm">긴 바늘</span>이 12에 있으면 <b>정각</b>이에요.</p><p>② <span class="hh">짧은 바늘</span>이 가리키는 숫자를 읽어요.</p>`
    : `<p>① <span class="hh">짧은 바늘</span>을 먼저 봐요. 지나온 숫자가 <b>몇 시</b>예요.</p><p>② <span class="mm">긴 바늘</span>을 봐요. 바깥 파란 숫자가 <b>몇 분</b>이에요.</p>`;
}
function showChoices(){
  state.choices = makeChoices(state.cur, levelOf().step);
  $('#question').textContent = state.level === 1 ? '몇 시일까요?' : '몇 시 몇 분일까요?';
  const box = $('#choices');
  box.innerHTML = state.choices.map(c => `<button type="button" class="choice" data-key="${key(c)}">${fmt(c)}</button>`).join('');
  box.hidden = false; $('#stopBtn').hidden = true;
  renderClock(); renderHint();
}
function newQuestion(){
  clearTimers(); stopSound(); cancelAnimationFrame(raf);
  state.wrong = 0; state.solved = false; state.hint = false;
  const fb = $('#feedback'); fb.className = 'feedback'; fb.innerHTML = '';
  $('#nextBtn').hidden = true;
  if(state.mode === 'stop'){
    state.phase = 'running'; state.cur = null; state.T = rand(720);
    $('#question').textContent = '시계가 움직여요. 멈춤을 눌러요!';
    const box = $('#choices'); box.innerHTML = ''; box.hidden = true;
    const sb = $('#stopBtn'); sb.hidden = false; sb.disabled = false;
    renderClock(); renderHint(); startRun();
  }else{
    state.phase = 'answer';
    state.cur = randomProblem(levelOf().step, state.cur ? new Set([key(state.cur)]) : null);
    showChoices();
  }
}
function applyKind(){
  const dig = state.kind === 'digital';
  $('#kindAnalog').setAttribute('aria-pressed', !dig);
  $('#kindDigital').setAttribute('aria-pressed', dig);
  $('#legH').textContent = dig ? '앞 숫자 = 시' : '짧은 바늘 = 시';
  $('#legM').textContent = dig ? '뒤 숫자 = 분' : '긴 바늘 = 분';
  $('#optHintText').textContent = dig ? '시·분 표시 넣기' : '분 숫자 보여 주기';
  store.set('kind', state.kind);
}
function applyMode(){
  $('#modeRead').setAttribute('aria-pressed', state.mode === 'read');
  $('#modeStop').setAttribute('aria-pressed', state.mode === 'stop');
  store.set('mode', state.mode);
}
function onChoice(btn){
  if(state.solved || btn.disabled) return;
  const fb = $('#feedback'), p = state.cur;
  if(btn.dataset.key !== key(p)){
    state.wrong++;
    btn.classList.add('wrong'); btn.disabled = true;
    fb.className = 'feedback no';
    fb.innerHTML = '괜찮아요. 다시 한번 해 봐요! 💪';
    if(!state.muted && newBus()) oops(ctx.currentTime+.02);
    if(state.wrong >= 2 && !state.hint){ state.hint = true; renderClock(); renderHint(); }
    return;
  }
  state.solved = true; state.stars++;
  document.querySelectorAll('.choice').forEach(b => { b.disabled = true; b.classList.add(b === btn ? 'right' : 'dim'); });
  $('#stars').textContent = `⭐ ${state.stars}개`;
  const onHour = p.m === 0;
  const dig = state.kind === 'digital', nh = dig ? '앞 숫자' : '짧은 바늘', nm = dig ? '뒤 숫자' : '긴 바늘';
  const explain = onHour
    ? `<span class="hh">${nh}</span> ${p.h} → <b>${p.h}시</b>`
    : `<span class="hh">${nh}</span> → ${p.h}시, <span class="mm">${nm}</span> → ${p.m}분`;
  fb.className = 'feedback ok';
  fb.innerHTML = `<strong>🎉 ${PRAISE[rand(PRAISE.length)]}</strong>${fmt(p)}${onHour ? '예요' : '이에요'}. (${explain})` +
    (onHour ? `<div class="chimes">${'<span class="bell">🔔</span>'.repeat(p.h)}<span class="chime-count" id="chimeCount"></span></div>` : '');
  const next = $('#nextBtn'); next.hidden = false; next.focus({preventScroll:true});

  clearTimers(); party();
  const sound = !state.muted && newBus();
  const t0 = sound ? ctx.currentTime + .03 : 0;
  if(sound) fanfare(t0);
  if(onHour){                    // 정각: 시간 수만큼 댕댕
    const start = 1.25, gap = .85, bells = fb.querySelectorAll('.bell');
    for(let i=0;i<p.h;i++){
      if(sound) bell(t0 + start + i*gap);
      timers.push(setTimeout(() => {
        bells[i].classList.add('on');
        const c = $('#chimeCount'); if(c) c.textContent = `댕! ${i+1}번`;
      }, (start + i*gap)*1000));
    }
  }
}

/* ───────── 종이 학습지 ───────── */
let sheetClocks = [];
function sheetCount(){ return +document.querySelector('input[name="cnt"]:checked').value; }
function genSheet(){
  const step = levelOf().step, n = sheetCount(), used = new Set(), list = [];
  for(let i=0;i<n;i++){ const p = randomProblem(step, used); used.add(key(p)); list.push(p); }
  state.sheet = list; renderSheet();
}
function pageHTML(items, offset, pageNo, total, withAns){
  const l = levelOf(), hint = $('#optHint').checked, dig = state.kind === 'digital';
  const cells = items.map((p, i) => {
    const hour = `<span class="p-blank">${withAns ? p.h : ''}</span>시`;
    const min = l.id === 1 ? '' : `<span class="p-blank">${withAns ? p.m : ''}</span>분`;
    return `<div class="p-item"><span class="p-num">${offset+i+1}</span>${dig ? digitalHTML(minutesOf(p), hint) : clockHTML(minutesOf(p), hint)}<div class="p-ans">${hour}${min}</div></div>`;
  }).join('');
  return `<article class="page">
    <div class="p-head"><div class="p-title">시계 보기 학습지</div><div class="p-badge${withAns?' ans':''}">${withAns?'정답 · ':''}${l.id}단계 · ${l.name}</div></div>
    <div class="p-info"><span>이름 <u style="width:45mm"></u></span><span>날짜 <u style="width:14mm"></u>월 <u style="width:14mm"></u>일</span></div>
    <div class="p-guide">${dig?'전자시계':'시계'}를 보고 ${l.id===1?'몇 시':'몇 시 몇 분'}인지 빈칸에 쓰세요.</div>
    <div class="p-grid">${cells}</div>
    <div class="p-foot"><div><span class="k kh"><i></i>${dig?'앞 숫자':'짧은 바늘'} = 시</span><span class="k km"><i></i>${dig?'뒤 숫자':'긴 바늘'} = 분</span></div><div>${pageNo} / ${total}</div></div>
  </article>`;
}
function renderSheet(){
  const chunks = [];
  for(let i=0;i<state.sheet.length;i+=6) chunks.push(state.sheet.slice(i, i+6));
  const ans = $('#optAns').checked, total = chunks.length*(ans?2:1);
  let html = chunks.map((c, i) => pageHTML(c, i*6, i+1, total, false)).join('');
  if(ans) html += chunks.map((c, i) => pageHTML(c, i*6, chunks.length+i+1, total, true)).join('');
  sheetClocks.forEach(el => Kit.unmount(el));
  $('#pages').innerHTML = html;
  sheetClocks = [...document.querySelectorAll('#pages .rc')];
  sheetClocks.forEach(el => Kit.render(el, +el.dataset.t));
}

/* ───────── 설정: 확대 · 소리 · 탭 ───────── */
function applyZoom(){
  document.documentElement.style.fontSize = ZOOMS[state.zoom] + '%';
  $('#zoomVal').textContent = ZOOMS[state.zoom] + '%';
  $('#zoomOut').disabled = state.zoom === 0;
  $('#zoomIn').disabled = state.zoom === ZOOMS.length-1;
  store.set('zoom', state.zoom);
}
function applySound(){
  const b = $('#soundBtn');
  b.setAttribute('aria-pressed', state.muted);
  b.textContent = state.muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
  store.set('muted', state.muted);
}
function showTab(sheet){
  $('#tabPlay').setAttribute('aria-selected', !sheet);
  $('#tabSheet').setAttribute('aria-selected', sheet);
  $('#playView').hidden = sheet; $('#sheetView').hidden = !sheet;
  if(sheet){ clearTimers(); stopSound(); cancelAnimationFrame(raf); }
  else if(state.phase !== 'answer') newQuestion();
}

$('#zoomIn').onclick = () => { if(state.zoom < ZOOMS.length-1){ state.zoom++; applyZoom(); } };
$('#zoomOut').onclick = () => { if(state.zoom > 0){ state.zoom--; applyZoom(); } };
$('#soundBtn').onclick = () => { state.muted = !state.muted; if(state.muted) stopSound(); applySound(); };
$('#tabPlay').onclick = () => showTab(false);
$('#tabSheet').onclick = () => showTab(true);
$('#levels').onclick = e => {
  const b = e.target.closest('.level'); if(!b) return;
  state.level = +b.dataset.level; store.set('level', state.level);
  renderLevels(); state.cur = null; newQuestion(); genSheet();
};
$('#choices').onclick = e => { const b = e.target.closest('.choice'); if(b) onChoice(b); };
$('#nextBtn').onclick = newQuestion;
$('#stopBtn').onclick = stopRun;
const setKind = k => { state.kind = k; applyKind(); state.cur = null; newQuestion(); renderSheet(); };
$('#kindAnalog').onclick = () => setKind('analog');
$('#kindDigital').onclick = () => setKind('digital');
$('#modeRead').onclick = () => { state.mode = 'read'; applyMode(); state.cur = null; newQuestion(); };
$('#modeStop').onclick = () => { state.mode = 'stop'; applyMode(); newQuestion(); };
$('#hintBtn').onclick = () => { state.hint = !state.hint; renderClock(); renderHint(); };
document.querySelectorAll('input[name="cnt"]').forEach(r => r.onchange = genSheet);
$('#optHint').onchange = renderSheet;
$('#optAns').onchange = renderSheet;
$('#regenBtn').onclick = genSheet;
$('#printBtn').onclick = () => window.print();

applyZoom(); applySound(); applyKind(); applyMode(); renderLevels(); newQuestion(); genSheet();
})();
</script>
</body>
